name: Windows stability

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/windows-*

permissions:
  contents: read

concurrency:
  group: windows-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-package-and-smoke:
    name: Test, package, and cold-start
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-desktop.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            presentation-studio/package-lock.json

      - name: Record Windows environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture |
            ConvertTo-Json |
            Set-Content -Encoding utf8 artifacts/windows-environment.json
          python --version
          node --version
          npm --version

      - name: Install Python and Node dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-desktop.txt
          python -m pip install "pytest>=8.3,<9"
          npm --prefix frontend ci
          npm --prefix presentation-studio ci

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest --junitxml=artifacts/pytest.xml

      - name: Run presentation runtime tests
        shell: pwsh
        run: npm --prefix presentation-studio test

      - name: Build frontend and packaged application
        shell: pwsh
        env:
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}\.pyinstaller-cache
        run: |
          npm --prefix frontend run build
          npm --prefix presentation-studio run build
          python desktop/make_icons.py
          python -m PyInstaller --noconfirm --clean `
            --distpath desktop_dist `
            --workpath desktop_build `
            desktop/PaperMorrow.spec
          if (-not (Test-Path desktop_dist\PaperMorrow\PaperMorrow.exe)) {
            throw "PyInstaller did not create PaperMorrow.exe"
          }

      - name: Cold-start packaged application three times
        shell: pwsh
        run: |
          $exe = (Resolve-Path "desktop_dist\PaperMorrow\PaperMorrow.exe").Path
          1..3 | ForEach-Object {
            $attempt = $_
            $runRoot = Join-Path $env:RUNNER_TEMP "papermorrow-smoke-$attempt"
            $appData = Join-Path $runRoot "AppData"
            $marker = Join-Path $env:GITHUB_WORKSPACE "artifacts\smoke-$attempt.json"
            New-Item -ItemType Directory -Force $appData | Out-Null

            $env:APPDATA = $appData
            $env:PAPERMORROW_SMOKE_TEST = "1"
            $env:PAPERMORROW_SMOKE_MARKER = $marker
            $process = Start-Process -FilePath $exe -PassThru

            if (-not $process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force
              throw "Cold start $attempt timed out after 60 seconds"
            }
            if ($process.ExitCode -ne 0) {
              throw "Cold start $attempt exited with code $($process.ExitCode)"
            }
            if (-not (Test-Path $marker)) {
              throw "Cold start $attempt did not create its health marker"
            }

            $result = Get-Content $marker -Raw | ConvertFrom-Json
            if ($result.status -ne "ok" -or $result.service -ne "PaperMorrow") {
              throw "Cold start $attempt returned an invalid health result"
            }
            if (-not $result.database_created) {
              throw "Cold start $attempt did not initialize its database"
            }
            Write-Host "Cold start $attempt passed: $($result.platform)"
          }

      - name: Build Windows installer and portable archive
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          Compress-Archive `
            -Path desktop_dist\PaperMorrow `
            -DestinationPath desktop_dist\PaperMorrow-Windows-Portable.zip `
            -CompressionLevel Optimal
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=0.4.4" `
            desktop\installer\PaperMorrow.iss
          if (-not (Test-Path desktop_dist\PaperMorrow-Windows-Setup.exe)) {
            throw "Inno Setup did not create the Windows installer"
          }

      - name: Upload Windows stability report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-stability-report
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
