name: Build desktop apps

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: PaperMorrow-macOS
          - os: windows-2022
            artifact: PaperMorrow-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            presentation-studio/package-lock.json
      - name: Install project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-desktop.txt
          npm --prefix frontend ci
          npm --prefix presentation-studio ci
      - name: Build frontend and icons
        shell: bash
        run: |
          npm --prefix frontend run build
          npm --prefix presentation-studio run build
          python desktop/make_icons.py
      - name: Run release checks
        shell: bash
        run: |
          python -m pytest -q
          npm --prefix frontend run build
      - name: Package application
        shell: bash
        env:
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.pyinstaller-cache
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            export PAPERMORROW_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          fi
          python -m PyInstaller --noconfirm --clean --distpath desktop_dist --workpath desktop_build desktop/PaperMorrow.spec
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - desktop_dist/PaperMorrow.app
          mkdir -p desktop_build/dmg
          cp -R desktop_dist/PaperMorrow.app desktop_build/dmg/PaperMorrow.app
          ln -s /Applications desktop_build/dmg/Applications
          hdiutil create -volname PaperMorrow -srcfolder desktop_build/dmg -ov -format UDZO desktop_dist/PaperMorrow-macOS.dmg
      - name: Create Windows installer and portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "0.5.0"
          $RefName = "${{ github.ref_name }}"
          if ($RefName -match '^v(\d+\.\d+\.\d+)$') { $Version = $Matches[1] }
          choco install innosetup --no-progress -y
          Compress-Archive -Path desktop_dist\PaperMorrow -DestinationPath desktop_dist\PaperMorrow-Windows-Portable.zip -CompressionLevel Optimal
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$Version" desktop\installer\PaperMorrow.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop_dist/PaperMorrow-macOS.dmg
            desktop_dist/PaperMorrow-Windows-Setup.exe
            desktop_dist/PaperMorrow-Windows-Portable.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish beta release assets on GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum PaperMorrow-* > SHA256SUMS.txt
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --title "PaperMorrow ${{ github.ref_name }} Beta" --generate-notes --prerelease
          fi
          gh release upload "${{ github.ref_name }}" ./* --clobber
