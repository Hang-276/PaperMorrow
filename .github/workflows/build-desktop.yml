name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: PaperMorrow-macOS
          - os: windows-2022
            artifact: PaperMorrow-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-desktop.txt
          npm --prefix frontend ci
      - name: Build frontend and icons
        shell: bash
        run: |
          npm --prefix frontend run build
          python desktop/make_icons.py
      - name: Package application
        shell: bash
        env:
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.pyinstaller-cache
        run: python -m PyInstaller --noconfirm --clean --distpath desktop_dist --workpath desktop_build desktop/PaperMorrow.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop_dist/PaperMorrow.app
            desktop_dist/PaperMorrow
          if-no-files-found: error
