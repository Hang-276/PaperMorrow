[project]
name = "papermorrow"
version = "0.5.4"
description = "AI paper recommendation, learning notes, and DeepWiki code analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "sqlalchemy>=2.0.36,<3.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.7.0,<3.0",
    "httpx>=0.28.0,<1.0",
    "apscheduler>=3.11.0,<4.0",
    "python-dotenv>=1.0.1,<2.0",
    "jinja2>=3.1.5,<4.0",
    "gitignore-parser>=0.1.11",
    "pypdf>=5.4.0,<7.0",
    "langchain>=1.0.2,<2.0",
    "langchain-openai>=1.0.0,<2.0",
    "langchain-anthropic>=1.0.0,<2.0",
    "langgraph>=1.0.1,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0,<9.0"]
desktop = [
    "pyinstaller>=6.14,<7",
    "pywebview>=5.4,<7",
    "pillow>=11,<13",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["desktop*", "frontend*", "presentation-studio*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
